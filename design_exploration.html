<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rune</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: 'Space Grotesk', sans-serif; color: #e8e4df; }
        #c { width: 100vw; height: 100vh; display: block; }
        .ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
        .ui > * { pointer-events: auto; }
        .tag { position: absolute; top: 24px; left: 24px; }
        .tag .t1 { font: 600 22px/1 'Caveat', cursive; color: #bbb; }
        .tag .t2 { font: 300 12px/1.4 'Space Grotesk'; color: #555; margin-top: 4px; }
        .hd { position: absolute; top: 20px; right: 24px; text-align: right; }
        .hd .n { font: 700 58px/1 'Space Grotesk'; letter-spacing: -3px; transition: color 1s; }
        .hd .l { font: 300 9px/1 'DM Mono'; color: #555; letter-spacing: 4px; text-transform: uppercase; margin-top: 6px; }
        .subs { position: absolute; right: 24px; top: 108px; display: flex; flex-direction: column; gap: 8px; }
        .sr { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
        .sn { font: 400 13px/1 'Caveat', cursive; color: #666; transition: color 0.5s; }
        .sd { width: 6px; height: 6px; border-radius: 50%; background: #444; transition: all 0.8s; }
        .vp { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); text-align: center; width: 90%; max-width: 420px; background: rgba(8,8,8,0.8); border: 1px solid rgba(255,255,255,0.04); border-radius: 14px; padding: 14px 20px; }
        .vp .vt { font: 400 15px/1.5 'Caveat', cursive; color: #888; transition: color 0.6s; }
        .ctrls { position: absolute; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 6px; }
        .cb { padding: 7px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.06); background: rgba(8,8,8,0.8); font: 400 11px/1 'Caveat', cursive; color: #777; cursor: pointer; transition: all 0.3s; }
        .cb:hover { color: #bbb; border-color: rgba(255,255,255,0.12); }
        .cb.on { color: #D4843A; border-color: rgba(212,132,58,0.3); }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
    <div class="tag"><div class="t1">Rune</div><div class="t2">2026 Accord SE</div></div>
    <div class="hd"><div class="n" id="hs">96</div><div class="l">Health</div></div>
    <div class="subs">
        <div class="sr"><span class="sn">Engine</span><span class="sd" data-s="engine"></span></div>
        <div class="sr"><span class="sn">CVT</span><span class="sd" data-s="transmission"></span></div>
        <div class="sr"><span class="sn">Cooling</span><span class="sd" data-s="cooling"></span></div>
        <div class="sr"><span class="sn">Fuel</span><span class="sd" data-s="fuel"></span></div>
        <div class="sr"><span class="sn">Exhaust</span><span class="sd" data-s="exhaust"></span></div>
        <div class="sr"><span class="sn">Electrical</span><span class="sd" data-s="electrical"></span></div>
    </div>
    <div class="vp" id="vp"><div class="vt" id="vt">All good. Running clean today.</div></div>
    <div class="ctrls">
        <div class="cb" onclick="fault('engine')">Engine</div>
        <div class="cb" onclick="fault('cooling')">Cooling</div>
        <div class="cb" onclick="fault('fuel')">Fuel</div>
        <div class="cb" onclick="fault('exhaust')">Exhaust</div>
        <div class="cb" onclick="fault('electrical')">Electrical</div>
        <div class="cb" onclick="reset()">Reset</div>
    </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));
R.setClearColor(0x000000,1);

const S=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,0.1,100);
cam.position.set(7,3.2,5);

const ctrl=new OrbitControls(cam,R.domElement);
ctrl.enableDamping=true;ctrl.dampingFactor=0.04;ctrl.target.set(0,0.5,0);
ctrl.minDistance=4;ctrl.maxDistance=14;ctrl.maxPolarAngle=Math.PI/2.1;
ctrl.autoRotate=true;ctrl.autoRotateSpeed=0.15;ctrl.enablePan=false;

const comp=new EffectComposer(R);
comp.addPass(new RenderPass(S,cam));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.4,0.4,0.6);
comp.addPass(bloom);

const HEALTHY=0xccccbb;
const DIM=0x333330;
const ALERT={engine:0xD4843A,transmission:0xD4843A,cooling:0xD4843A,fuel:0xC4441A,exhaust:0xC4441A,electrical:0xD4843A};
const MSGS={
    engine:"RPM instability at idle. Could be a vacuum leak.",
    cooling:"Running warmer than I should be. 103 degrees.",
    fuel:"Fuel trims drifting. LTFT at 12% and climbing.",
    exhaust:"Catalyst efficiency dropping for two weeks.",
    electrical:"Voltage trending down under load. 13.2 now.",
};

const draco=new DRACOLoader();
draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
const loader=new GLTFLoader();loader.setDRACOLoader(draco);

let car=null;
const edgeObjects={};
const nameToZone={};

// Sketchy line shader -- gives Excalidraw hand-drawn feel
const sketchyVertexShader=`
    attribute float lineDistance;
    varying float vDist;
    varying vec3 vPos;
    void main(){
        vDist=lineDistance;
        vPos=position;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
    }
`;
const sketchyFragmentShader=`
    uniform vec3 uColor;
    uniform float uOpacity;
    uniform float uTime;
    varying float vDist;
    varying vec3 vPos;

    // Simple hash for pseudo-random
    float hash(float n){return fract(sin(n)*43758.5453);}

    void main(){
        // Slight opacity variation along the line -- gives hand-drawn feel
        float wobble=hash(floor(vPos.x*80.0)+floor(vPos.y*80.0)+floor(vPos.z*80.0));
        float alpha=uOpacity*(0.6+wobble*0.4);

        // Very subtle flicker
        alpha*=0.95+0.05*sin(uTime*0.5+vPos.x*10.0);

        gl_FragColor=vec4(uColor,alpha);
    }
`;

function makeSketchMat(color,opacity){
    return new THREE.ShaderMaterial({
        uniforms:{
            uColor:{value:new THREE.Color(color)},
            uOpacity:{value:opacity},
            uTime:{value:0},
        },
        vertexShader:sketchyVertexShader,
        fragmentShader:sketchyFragmentShader,
        transparent:true,
        depthWrite:false,
    });
}

loader.load('frontend/public/models/rune_sedan.glb',gltf=>{
    car=new THREE.Group();
    const raw=gltf.scene;
    const box=new THREE.Box3().setFromObject(raw);
    const center=box.getCenter(new THREE.Vector3());

    // Log all names for debugging
    const names=[];
    raw.traverse(ch=>{if(ch.isMesh)names.push(ch.name);});
    console.log('GLB mesh names:',names);

    raw.traverse(ch=>{
        if(!ch.isMesh)return;
        const n=ch.name;

        // Zone assignment based on mesh name AND position
        let zone='neutral';

        // Use world position to determine zone (more reliable than name matching)
        ch.parent.updateWorldMatrix(true,false);
        const worldPos=new THREE.Vector3();
        const bbox=new THREE.Box3().setFromObject(ch);
        bbox.getCenter(worldPos);

        // Front = negative Y, Rear = positive Y in this model
        // Left (driver) = negative X, Right (passenger) = positive X
        const isFront=worldPos.y<-0.3;
        const isRear=worldPos.y>1.0;
        const isLeft=worldPos.x<-0.05;
        const isRight=worldPos.x>0.05;
        const isBottom=worldPos.z<0.35;

        // Name-based overrides for specific parts
        if(n.includes('zone_hood_right')||n.includes('ELANTRA_BODY_Car_0.005')){
            zone='engine';
        } else if(n.includes('zone_hood_left')||n.includes('ELANTRA_BODY_Car_0.004')){
            zone='transmission';
        } else if(n.includes('zone_trunk_right')||n.includes('ELANTRA_BODY_Car_0.002')){
            zone='exhaust';
        } else if(n.includes('zone_trunk_left')||n.includes('ELANTRA_BODY_Car_0.001')){
            zone='fuel';
        } else if(n.includes('zone_cabin')||n.includes('ELANTRA_BODY_Car_0.003')||n.includes('ELANTRA_BODY_Car_0.004')){
            zone='neutral';
        }
        // Grille = cooling
        else if(n.includes('BlackPlastic')&&!n.includes('Plane')&&!n.includes('Cylinder')&&isFront){
            zone='cooling';
        }
        // Underbody = exhaust
        else if(n==='Cube.006_Metal_0'||n.includes('Bottom')){
            zone='exhaust';
        }
        // Taillights = exhaust zone
        else if(n.includes('RedLight')&&isRear){
            zone='exhaust';
        }
        // Headlight area = electrical
        else if(n.includes('OrangeLight')&&isFront){
            zone='electrical';
        }
        // Position-based fallback for zone_ meshes that got renamed in GLB
        else if(isFront&&isRight) zone='engine';
        else if(isFront&&isLeft) zone='transmission';
        else if(isRear&&isRight) zone='exhaust';
        else if(isRear&&isLeft) zone='fuel';

        nameToZone[n]=zone;

        // Create edges with sketchy material
        const edges=new THREE.EdgesGeometry(ch.geometry,12);
        const mat=makeSketchMat(HEALTHY,0.85);
        const line=new THREE.LineSegments(edges,mat);
        line.name=n;
        line.applyMatrix4(ch.matrixWorld);

        edgeObjects[n]=line;
        car.add(line);
    });

    car.position.set(-center.x,0,-center.z);
    S.add(car);
    console.log('Zone assignments:',nameToZone);
});

let activeFault=null,t=0;

const FAULT_ZONES={
    engine:['engine'],
    transmission:['transmission'],
    cooling:['engine','transmission','cooling'],
    fuel:['fuel'],
    exhaust:['exhaust'],
    electrical:['engine','electrical'],
};

window.fault=function(sub){
    activeFault=sub;
    document.querySelectorAll('.cb').forEach(b=>b.classList.remove('on'));
    event.target.classList.add('on');

    const col=ALERT[sub];
    const colHex='#'+col.toString(16).padStart(6,'0');
    const score=sub==='cooling'?84:sub==='fuel'?72:sub==='exhaust'?78:80;
    document.getElementById('hs').textContent=score;
    document.getElementById('hs').style.color=colHex;
    document.getElementById('vt').textContent=MSGS[sub]||'Something needs attention.';
    document.getElementById('vt').style.color=colHex;

    document.querySelectorAll('.sd').forEach(d=>{d.style.background='#444';d.style.boxShadow='none';});
    document.querySelectorAll('.sn').forEach(s=>s.style.color='#666');
    const dot=document.querySelector('[data-s="'+sub+'"]');
    if(dot){dot.style.background=colHex;dot.style.boxShadow='0 0 8px '+colHex+'88';if(dot.previousElementSibling)dot.previousElementSibling.style.color='#ccc';}

    const activeZones=FAULT_ZONES[sub]||[];
    const alertCol=new THREE.Color(col);
    const dimCol=new THREE.Color(DIM);
    const healthyCol=new THREE.Color(HEALTHY);

    for(const[name,line]of Object.entries(edgeObjects)){
        const z=nameToZone[name]||'neutral';
        const affected=activeZones.includes(z);
        line.material.uniforms.uColor.value.copy(affected?alertCol:dimCol);
        line.material.uniforms.uOpacity.value=affected?1.0:0.12;
    }
};

window.reset=function(){
    activeFault=null;
    document.querySelectorAll('.cb').forEach(b=>b.classList.remove('on'));
    document.getElementById('hs').textContent='96';
    document.getElementById('hs').style.color='#e8e4df';
    document.getElementById('vt').textContent='All good. Running clean today.';
    document.getElementById('vt').style.color='#888';
    document.querySelectorAll('.sd').forEach(d=>{d.style.background='#444';d.style.boxShadow='none';});
    document.querySelectorAll('.sn').forEach(s=>s.style.color='#666');

    const healthyCol=new THREE.Color(HEALTHY);
    for(const line of Object.values(edgeObjects)){
        line.material.uniforms.uColor.value.copy(healthyCol);
        line.material.uniforms.uOpacity.value=0.85;
    }
};

function animate(){
    requestAnimationFrame(animate);
    t+=0.016;ctrl.update();
    if(car)car.position.y=Math.sin(t*0.35)*0.002;

    // Update time uniform for sketchy flicker
    for(const line of Object.values(edgeObjects)){
        line.material.uniforms.uTime.value=t;
    }

    // Pulse affected zones
    if(activeFault){
        const activeZones=FAULT_ZONES[activeFault]||[];
        const pulse=0.65+Math.sin(t*1.5)*0.35;
        for(const[name,line]of Object.entries(edgeObjects)){
            const z=nameToZone[name]||'neutral';
            if(activeZones.includes(z)){
                line.material.uniforms.uOpacity.value=pulse;
            }
        }
    }

    comp.render();
}
animate();

addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);comp.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
